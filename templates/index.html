<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroCam Dashboard</title>
    <style>
        :root { color-scheme: dark; --panel: #20252b; --panel-border: #363d45; --text-muted: #aeb8c3; --accent: #4aa3df; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #101316; color: #f5f7fa; margin: 0; overflow: hidden; }
        .app-shell { display: grid; grid-template-columns: minmax(0, 1fr) 330px; width: 100vw; height: 100vh; }
        .workspace { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 18px; background: #080a0c; }
        #videoFeed {
            background: black;
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        #videoContainer {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border: 1px solid #252b31;
            overflow: hidden;
            line-height: 0;
            background: black;
        }
        #measurementCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .sidebar { display: flex; flex-direction: column; gap: 18px; min-width: 0; padding: 24px 20px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--panel-border); }
        h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0; }
        .section { padding-bottom: 18px; border-bottom: 1px solid var(--panel-border); }
        .section:last-child { border-bottom: 0; }
        .section-title { display: block; margin-bottom: 10px; color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        select, input[type=range], input[type=text] { display: block; width: 100%; margin: 0; }
        select, input[type=text] { padding: 10px; border: 1px solid #4b555f; border-radius: 4px; background: #14181c; color: white; }
        input[type=range] { accent-color: var(--accent); }
        .range-row { display: flex; align-items: center; gap: 12px; }
        .range-row input { flex: 1; }
        .range-value { min-width: 42px; color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button { min-height: 40px; padding: 9px 12px; border: 1px solid #4b555f; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; color: white; background: #303840; }
        button:hover { filter: brightness(1.15); }
        .btn-refresh { width: 100%; margin-top: 8px; background: #28658c; border-color: #3986b8; }
        .btn-save { background: #28a745; color: white; }
        .btn-measure { background: #f0ad4e; color: #111; }
        #measurementStatus, #status { margin: 10px 0 0; color: var(--text-muted); font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main class="app-shell">
      <section class="workspace" aria-label="Camera image">
        <div id="videoContainer">
            <img id="videoFeed" src="" alt="No camera selected" onload="resizeMeasurementCanvas()">
            <canvas id="measurementCanvas"></canvas>
        </div>
      </section>
      <aside class="sidebar">
        <h1>MikroCam Dashboard</h1>
        <section class="section">
            <span class="section-title">Kamera</span>
            <select id="cameraSelect" onchange="selectCamera()">
                <option value="">-- select a camera --</option>
            </select>
            <button class="btn-refresh" onclick="refreshCameraList()">Refresh camera list</button>
        </section>
        <section class="section">
            <span class="section-title">Belichtungszeit</span>
            <div class="range-row">
                <input type="range" id="expSlider" oninput="onSliderInput(this.value)" disabled>
                <span class="range-value" id="expVal">-</span>
            </div>
        </section>
        <section class="section">
            <span class="section-title">Speichern</span>
            <label for="filenameLabelInput">Dateiname (optional)</label>
            <input type="text" id="filenameLabelInput" placeholder="z. B. Probe-1">
            <div class="btns">
                <button class="btn-save" onclick="saveImage()">Bild speichern</button>
                <button class="btn-measure" type="button" onclick="startNewMeasurement()">
                    Neue Messung
                </button>
                <button type="button" onclick="resetMeasurement()">Messungen löschen</button>
            </div>
            <p id="measurementStatus">Zwei Punkte im Kamerabild anklicken, um die Entfernung in Pixeln zu messen.</p>
            <p id="status">Speicherort: {{ save_dir }}</p>
        </section>
      </aside>
    </main>

    <script>
        function refreshCameraList() {
            fetch('/api/cameras').then(r => r.json()).then(data => {
                const select = document.getElementById('cameraSelect');
                select.innerHTML = '<option value="">-- select a camera --</option>';
                data.cameras.forEach(cam => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({driver_key: cam.driver_key, device_id: cam.device_id});
                    opt.textContent = cam.display_name;
                    select.appendChild(opt);
                });
            });
        }

        function selectCamera() {
            const select = document.getElementById('cameraSelect');
            if (!select.value) return;
            const choice = JSON.parse(select.value);

            fetch('/api/select', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(choice)
            }).then(r => r.json()).then(data => {
                if (!data.success) {
                    document.getElementById('status').innerText = 'Error: ' + data.message;
                    return;
                }
                document.getElementById('videoFeed').src = '/video_feed?ts=' + Date.now();
                resetMeasurement();

                const slider = document.getElementById('expSlider');
                slider.min = data.exposure_min;
                slider.max = data.exposure_max;
                slider.value = data.exposure_current;
                slider.disabled = false;
                document.getElementById('expVal').innerText = data.exposure_current;
            });
        }

        function onSliderInput(val) {
            document.getElementById('expVal').innerText = val;
            fetch('/api/set_exposure', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value: val})
            });
        }

        function saveImage() {
            const statusEl = document.getElementById('status');
            const label = document.getElementById('filenameLabelInput').value;
            const savedMeasurements = measurements.map(measurement => ({
                first: {
                    nativeX: measurement.first.nativeX,
                    nativeY: measurement.first.nativeY
                },
                second: {
                    nativeX: measurement.second.nativeX,
                    nativeY: measurement.second.nativeY
                }
            }));
            statusEl.innerText = 'Saving...';
            fetch('/api/save_image', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    label: label,
                    measurements: savedMeasurements
                })
            }).then(r => r.json()).then(data => {
                statusEl.innerText = data.message;
            });
        }

        // HEADER: Converts the displayed image size into the canvas coordinate space.
        function resizeMeasurementCanvas() {
            const image = document.getElementById('videoFeed');
            const canvas = document.getElementById('measurementCanvas');
            const rect = image.getBoundingClientRect();
            canvas.width = Math.round(rect.width);
            canvas.height = Math.round(rect.height);
            drawMeasurement();
        }

        // HEADER: Maps a native camera point to the current displayed image size.
        function toDisplayPoint(point) {
            const image = document.getElementById('videoFeed');
            const rect = image.getBoundingClientRect();
            return {
                displayX: point.nativeX * rect.width / image.naturalWidth,
                displayY: point.nativeY * rect.height / image.naturalHeight
            };
        }

        // HEADER: Draws all completed measurements and the active point over the live image.
        function drawMeasurement() {
            const canvas = document.getElementById('measurementCanvas');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);

            context.font = 'bold 14px sans-serif';
            context.lineWidth = 2;
            measurements.forEach((measurement, index) => {
                const first = toDisplayPoint(measurement.first);
                const second = toDisplayPoint(measurement.second);
                const middleX = (first.displayX + second.displayX) / 2;
                const middleY = (first.displayY + second.displayY) / 2;
                const label = `#${index + 1}: ${measurement.distance.toFixed(2)} px`;

                context.strokeStyle = '#ffcc00';
                context.beginPath();
                context.moveTo(first.displayX, first.displayY);
                context.lineTo(second.displayX, second.displayY);
                context.stroke();

                context.fillStyle = '#ffcc00';
                [first, second].forEach(point => {
                    context.beginPath();
                    context.arc(point.displayX, point.displayY, 5, 0, 2 * Math.PI);
                    context.fill();
                });

                const labelWidth = context.measureText(label).width;
                context.fillStyle = 'rgba(0, 0, 0, 0.75)';
                context.fillRect(middleX - 4, middleY - 15, labelWidth + 8, 22);
                context.fillStyle = '#ffffff';
                context.fillText(label, middleX, middleY - 4);
            });

            if (measurementPoints.length === 1) {
                const point = toDisplayPoint(measurementPoints[0]);
                context.fillStyle = '#ffcc00';
                context.beginPath();
                context.arc(point.displayX, point.displayY, 5, 0, 2 * Math.PI);
                context.fill();
            }
        }

        // HEADER: Converts a click on the stream into native camera-image pixels and stores it.
        function handleMeasurementClick(event) {
            const image = document.getElementById('videoFeed');
            if (!image.naturalWidth || !image.naturalHeight) return;

            if (!isAddingMeasurement) {
                document.getElementById('measurementStatus').innerText =
                    'Click "Add another pair" before selecting more points.';
                return;
            }

            const rect = image.getBoundingClientRect();
            const displayX = event.clientX - rect.left;
            const displayY = event.clientY - rect.top;
            const cameraWidth = image.naturalWidth - {{ histogram_width }};
            const nativeX = displayX * image.naturalWidth / rect.width;

            if (nativeX >= cameraWidth || displayX < 0 || displayY < 0 ||
                displayX > rect.width || displayY > rect.height) {
                document.getElementById('measurementStatus').innerText =
                    'Please click inside the camera image, not the histogram.';
                return;
            }

            measurementPoints.push({
                nativeX: nativeX,
                nativeY: displayY * image.naturalHeight / rect.height,
                displayX: displayX,
                displayY: displayY
            });
            if (measurementPoints.length === 1) {
                drawMeasurement();
                document.getElementById('measurementStatus').innerText =
                    'First point selected. Click the second point.';
                return;
            }

            const first = measurementPoints[0];
            const second = measurementPoints[1];
            const distance = Math.hypot(second.nativeX - first.nativeX, second.nativeY - first.nativeY);
            measurements.push({first: first, second: second, distance: distance});
            measurementPoints = [];
            isAddingMeasurement = false;
            drawMeasurement();
            document.getElementById('measurementStatus').innerText =
                `Measurement ${measurements.length}: ${distance.toFixed(2)} px. ` +
                'Add another pair for a new measurement.';
        }

        // HEADER: Enables selection of a new pair without removing completed measurements.
        function startNewMeasurement() {
            measurementPoints = [];
            isAddingMeasurement = true;
            document.getElementById('measurementStatus').innerText =
                'Click two points in the camera image for the next measurement.';
            drawMeasurement();
        }

        // HEADER: Clears all pixel measurements and the active overlay.
        function resetMeasurement() {
            measurements = [];
            measurementPoints = [];
            isAddingMeasurement = true;
            document.getElementById('measurementStatus').innerText =
                'Click two points in the camera image to measure the distance in pixels.';
            drawMeasurement();
        }

        let measurementPoints = [];
        let measurements = [];
        let isAddingMeasurement = true;
        document.getElementById('measurementCanvas').addEventListener('click', handleMeasurementClick);
        window.addEventListener('resize', resizeMeasurementCanvas);

        refreshCameraList();

        // Keeps the server informed that this tab is still open; the server
        // shuts itself down once these pings stop arriving (tab closed).
        setInterval(() => {
            fetch('/api/heartbeat', {method: 'POST'}).catch(() => {});
        }, {{ heartbeat_interval_ms }});
    </script>
</body>
</html>
